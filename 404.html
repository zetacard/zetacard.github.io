<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZetaCard</title></head><body><script>(function(){const path=location.pathname.replace(/^\/+|\/+$/g,"");if(path&&/^[a-z0-9][a-z0-9-]{2,29}$/.test(path)&&!path.includes("/")){location.replace("/?u="+encodeURIComponent(path));}else{location.replace("/")}})();</script></body></html>
